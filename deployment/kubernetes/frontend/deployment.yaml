apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackflow-frontend
  namespace: trackflow-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trackflow-frontend
  template:
    metadata:
      labels:
        app: trackflow-frontend
    spec:
      containers:
        - name: frontend
          image: itsurvey6/trackflow-frontend:57
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
